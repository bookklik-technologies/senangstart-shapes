<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSS-only shapes · SenangStart Shapes</title>
  <link rel="stylesheet" href="../dist/senangstart.min.css">
  <style>
    body{font-family:system-ui,sans-serif;margin:40px;color:#3e4a5d;background:#f5f7fb;line-height:1.6}
    main{max-width:950px;margin:auto}section{display:flex;flex-wrap:wrap;gap:20px}figure{margin:0;padding:24px;border-radius:12px;background:white;width:150px;text-align:center}i{font-size:90px;color:#2563eb}figcaption{font-size:13px;margin-top:20px}
  </style>
</head>
<body><main>
  <h1>CSS-only shapes</h1>
  <p>This page loads only the generated stylesheet. Duotone masks use a single color. Tonal opacity, clipping, and original aspect ratios are preserved.</p>
  <section aria-label="CSS mask examples">
    <figure><i class="ss-shape ss-shape-soft-nova" data-variant="solid" aria-hidden="true"></i><figcaption>Solid</figcaption></figure>
    <figure><i class="ss-shape ss-shape-soft-nova" data-variant="outline" aria-hidden="true"></i><figcaption>Outline</figcaption></figure>
    <figure><i class="ss-shape ss-shape-soft-nova" data-variant="duotone" aria-hidden="true"></i><figcaption>Duotone as mask</figcaption></figure>
    <figure><i class="ss-shape ss-shape-isometric-tall-prism" aria-hidden="true"></i><figcaption>Tonal default</figcaption></figure>
    <figure><i class="ss-shape ss-shape-soft-corner-southwest" aria-hidden="true"></i><figcaption>Clipped geometry</figcaption></figure>
    <figure><i class="ss-shape ss-shape-circle" data-variant="solid" aria-hidden="true"></i><figcaption>Circle</figcaption></figure>
  </section>
  <p><a href="../">Back to interactive gallery</a></p>
</main></body>
</html>
